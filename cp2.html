<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cyber Signal Intel v7.2 - Final Pro</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 20px; }
        .controls { margin-bottom: 15px; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-right: 10px; }
        #output { white-space: pre-wrap; border: 1px solid #00ff00; padding: 20px; background: #050505; min-height: 400px; }
    </style>
</head>
<body>
    <h2>CYBER SIGNAL INTEL - PRO TOOL</h2>
    <div class="controls">
        <button onclick="pasteFromClipboard()">Paste Gambar</button>
        <button onclick="copyToClipboard()">Copy Hasil</button>
        <button onclick="clearData()" style="background: #ff0000; color: #fff;">Clear</button>
    </div>
    <pre id="output">Klik tombol "Paste Gambar" di atas untuk memulai...</pre>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        // Fungsi Paste via Tombol
        async function pasteFromClipboard() {
            try {
                const clipboardItems = await navigator.clipboard.read();
                for (const item of clipboardItems) {
                    if (item.types.includes('image/png') || item.types.includes('image/jpeg')) {
                        const blob = await item.getType(item.types.find(t => t.startsWith('image/')));
                        processImage(blob);
                        return;
                    }
                }
                alert("Tidak ada gambar di clipboard!");
            } catch (err) {
                alert("Gagal membaca clipboard. Pastikan Anda sudah memberikan izin akses.");
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('output').innerText;
            navigator.clipboard.writeText(text).then(() => alert("Data disalin!"));
        }

        function clearData() {
            document.getElementById('output').innerText = "Data dibersihkan.";
        }

        // Event listener cadangan (untuk Ctrl+V)
        document.addEventListener('paste', async (e) => {
            const item = e.clipboardData.items[0];
            if (item?.type.startsWith('image')) processImage(item.getAsFile());
        });

        async function processImage(file) {
            const output = document.getElementById('output');
            output.innerText = "Memproses intelijen...";
            
            const { data: { text } } = await Tesseract.recognize(file, 'ind');
            
            const getVal = (keywords, defaultValue = "[DATA NOT DETECTED]") => {
                const lines = text.split('\n');
                for (let line of lines) {
                    for (let kw of keywords) {
                        if (line.toLowerCase().includes(kw.toLowerCase())) {
                            return line.replace(new RegExp(kw, 'gi'), '').replace(/[:\/\s-]+/, '').trim() || defaultValue;
                        }
                    }
                }
                return defaultValue;
            };

            const findURL = () => {
                const urlMatch = text.match(/(https?:\/\/[^\s]+)/i);
                return urlMatch ? urlMatch[0] : "[DATA NOT DETECTED]";
            };

            const template = `╔══════════════════════════════════════╗
        CYBER SIGNAL INTEL v7.2
╚══════════════════════════════════════╝

[ TARGET DEVICE ]
MSISDN        : ${getVal(['MSISDN'])}
DEVICE        : ${getVal(['Device', 'Brand/Tipe'])}
CARD TYPE     : ${getVal(['Operator'])}
NETWORK       : ${getVal(['Frekuensi', 'Tipe'])}
STATUS        : ${getVal(['Status'])}

[ DEVICE IDENTITY ]
IMEI          : ${getVal(['IMEI'])}
IMSI          : ${getVal(['IMSI'])}
ENB / ENODEB  : ${getVal(['eNodeB', 'ENB'])}
CGI           : ${getVal(['CGI'])}
LAC           : ${getVal(['LAC', 'LAC/TAC'])}
CELL ID       : ${getVal(['Cell ID', 'CID'])}

[ GEO TRACKING ]
COORDINATE    : ${getVal(['Koordinat'])}
ADDRESS       : ${getVal(['Alamat'])}
MAP ACCESS    : ${findURL()}

[ SIGNAL ANALYSIS ]
TOWER STATUS  : Connected (Azimuth: ${getVal(['Azimuth'])})
PRECISION     : Sektor Berdasarkan Azimuth ${getVal(['Azimuth'])}

[ FIELD NOTES (SURVEILLANCE GUIDANCE) ]
• LIVE CONNECTIVITY: Perangkat aktif dalam status ${getVal(['Status'])}.
• SURVEILLANCE CLUE: Sinyal dipancarkan ke arah ${getVal(['Azimuth'])}.
• PERIMETER LOCK: Target terdeteksi pada Cell ID: ${getVal(['Cell ID', 'CID'])} (LAC: ${getVal(['LAC', 'LAC/TAC'])}).
• GROUND POSITION: Koordinat ${getVal(['Koordinat'])} berada di area ${getVal(['Alamat']).split(',')[0]}.

══════════════════════════════════════
⚠ CONFIDENTIAL ACCESS
RESTRICTED DATA — INTERNAL USE ONLY
═══════════════════════════════════`;
            
            output.innerText = template;
        }
    </script>
</body>
</html>
